<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guion · Gerard 35</title>
    <style>
      :root { --bg: #14170f; --panel: #1b1f16; --card: #191d14; --line: #ffffff1c; --text: #ece6cf; --soft: #c7c1a6; --dim: #8f8a73; --gold: #f3cf78;
        --open: #f0a35a; --done: #7fc88f; --edit: #8fb4e0; --bad: #e0707a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 'DM Sans', system-ui, sans-serif; overflow: hidden; }
      button { padding: 3px 9px; border: 1px solid #ffffff2a; border-radius: 3px; background: #ffffff0d; color: inherit; font: inherit; font-size: 12px; cursor: pointer; }
      button:hover { background: #ffffff1f; } button.main { background: var(--gold); color: #1a1a12; border-color: var(--gold); } button.main:hover { background: #ffe09a; }
      button:disabled { opacity: .5; cursor: default; }
      input, select, textarea { background: #0e100b; color: var(--text); border: 1px solid var(--line); border-radius: 3px; font: inherit; }
      code { font: 11px ui-monospace, Menlo, monospace; color: var(--dim); }
      #app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
      #side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
      #side header { padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 8px; }
      h1 { margin: 0; font-size: 20px; } h1 small { color: var(--dim); font-size: 11px; font-weight: 400; margin-left: 6px; }
      #search, #who, #kind { width: 100%; padding: 6px 8px; }
      .row { display: flex; gap: 6px; } .row > * { flex: 1; min-width: 0; }
      label.check { display: flex; gap: 6px; align-items: center; color: var(--soft); font-size: 12px; cursor: pointer; }
      #about { color: var(--dim); font-size: 11.5px; line-height: 1.4; }
      #about b { color: var(--soft); font-weight: 500; }
      #nav { overflow: auto; padding: 4px 6px 16px; flex: 1; }
      #nav a { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 3px; color: var(--soft); text-decoration: none; cursor: pointer; }
      #nav a:hover { background: #ffffff0d; } #nav a small { color: var(--dim); } #nav a .open-notes { color: var(--open); }
      #script { overflow: auto; padding: 0 28px 120px; scroll-padding-top: 12px; }
      #script > section > h2 { position: sticky; top: 0; z-index: 2; margin: 0 -28px; padding: 14px 28px 8px; background: linear-gradient(var(--bg) 75%, #14170f00); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #b7b08f; font-weight: 600; }
      .entry { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; margin: 10px 0 14px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 5px; }
      .entry.target { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
      .entry.unplayed { background: #171a12; }
      .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 6px; color: var(--dim); font-size: 12px; }
      .head .n { color: var(--gold); font-weight: 600; font-size: 13px; } .head .n.tried { color: var(--soft); font-weight: 500; font-size: 11px; padding: 0 7px; border: 1px dashed #ffffff33; border-radius: 99px; }
      .head .kind { padding: 0 7px; border-radius: 99px; border: 1px solid #ffffff26; color: var(--soft); font-size: 11px; }
      .head .title { color: var(--soft); }
      .head a { color: var(--edit); text-decoration: none; } .head a:hover { text-decoration: underline; }
      .lines { display: flex; flex-direction: column; gap: 2px; }
      .say { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; padding: 4px 6px; margin: 0 -6px; border-radius: 4px; position: relative; }
      .say:hover { background: #ffffff07; }
      .face { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; background: var(--c, #555); display: grid; place-items: center; font-weight: 700; color: #14170f; font-size: 13px; border: 2px solid var(--c, #555); }
      .face img { width: 100%; height: 100%; object-fit: cover; }
      .who { font-size: 11.5px; font-weight: 600; color: var(--c, var(--soft)); letter-spacing: .02em; }
      .who code { margin-left: 6px; font-weight: 400; }
      .text { margin: 0; color: var(--text); white-space: pre-wrap; cursor: text; border-radius: 3px; }
      .text[data-editable] :hover, .text[data-editable]:hover { background: #ffffff0a; outline: 1px dashed #ffffff26; outline-offset: 2px; }
      .text.dynamic { color: var(--soft); font-style: italic; cursor: default; }
      .text.changed { color: var(--done); }
      .actions { position: absolute; right: 4px; top: 2px; display: none; gap: 3px; } .say:hover .actions { display: flex; }
      .actions button { font-size: 11px; padding: 1px 7px; background: #262b1e; }
      .editor { margin-top: 4px; display: flex; flex-direction: column; gap: 5px; }
      .editor textarea { width: 100%; padding: 6px 8px; resize: vertical; min-height: 54px; }
      .editor input { width: 100%; padding: 5px 8px; font-size: 12.5px; }
      .editor .buttons { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; } .editor .buttons small { color: var(--dim); margin-left: auto; }
      .msg { font-size: 12px; } .msg.err { color: var(--bad); } .msg.ok { color: var(--done); } .msg.warn { color: var(--open); }
      .photo { align-self: start; }
      .photo img { width: 100%; display: block; border-radius: 4px; border: 1px solid var(--line); cursor: zoom-in; }
      .photo .none { aspect-ratio: 16 / 9; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; text-align: center; padding: 12px; border: 1px dashed #ffffff22; border-radius: 4px; color: var(--dim); font-size: 12px; }
      .photo small { display: block; color: var(--dim); font-size: 11px; margin-top: 4px; }
      .notes { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; }
      .notes:empty { display: none; }
      .note { padding: 6px 10px; border-left: 3px solid var(--open); background: #ffffff06; border-radius: 0 4px 4px 0; font-size: 13px; }
      .note.hecha, .note.descartada { opacity: .55; border-left-color: var(--dim); }
      .note .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; color: var(--dim); font-size: 11.5px; }
      .note .meta b { color: var(--open); font-weight: 600; } .note.hecha .meta b, .note.descartada .meta b { color: var(--dim); }
      .note .meta .btns { margin-left: auto; display: flex; gap: 4px; } .note .meta button { font-size: 11px; padding: 0 7px; }
      .note p { margin: 3px 0 0; }
      .note .diff { display: grid; gap: 2px; margin-top: 3px; } .note .diff del { color: #d9a3a3; text-decoration: line-through; text-decoration-color: #e0707a99; } .note .diff ins { color: var(--done); text-decoration: none; }
      .note .reply { border-left: 2px solid var(--done); padding-left: 8px; color: var(--soft); }
      .entry-tools { grid-column: 1 / -1; display: flex; gap: 6px; align-items: center; }
      .entry-tools .comment { flex: 1; display: flex; gap: 6px; } .entry-tools .comment textarea { flex: 1; padding: 5px 8px; min-height: 34px; resize: vertical; }
      .text.removing { color: #d9a3a3; text-decoration: line-through; text-decoration-color: #e0707a99; }
      .ghost { margin: 2px -6px; padding: 2px 0 4px; border-left: 3px dashed var(--done); background: #7fc88f0d; border-radius: 0 4px 4px 0; }
      .ghost .say { margin: 0; } .ghost .say:hover { background: none; } .ghost .text { color: var(--done); cursor: default; }
      .ghost .note { margin: 2px 6px 0 50px; border-left-color: var(--done); background: none; padding: 0 4px; } .ghost .note .meta b { color: var(--done); }
      .say.adding { background: #7fc88f0d; border-left: 3px dashed var(--done); margin: 2px -6px; }
      .block-head { font-size: 11.5px; color: var(--done); font-weight: 600; }
      .block-row { display: grid; grid-template-columns: 170px minmax(0, 1fr) auto; gap: 6px; align-items: start; }
      .block-row select { padding: 5px 6px; border-left: 3px solid var(--c, #555); } .block-row textarea { min-height: 38px; }
      .note .lost { color: var(--bad); font-size: 12px; }
      .line-notes { margin: 4px 0 2px 0; display: flex; flex-direction: column; gap: 4px; }
      .empty { color: var(--dim); padding: 40px 0; }
      #zoom { position: fixed; inset: 0; background: #000000e0; display: none; place-items: center; z-index: 5; cursor: zoom-out; } #zoom img { max-width: 94vw; max-height: 94vh; }
      #toast { position: fixed; right: 18px; bottom: 18px; max-width: 460px; padding: 10px 14px; background: #262b1e; border: 1px solid var(--line); border-radius: 5px; display: none; z-index: 6; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="side">
        <header>
          <h1>Guion <small id="count"></small></h1>
          <input id="search" type="search" placeholder="Buscar texto, personaje o clave…" />
          <div class="row"><select id="who"></select><select id="kind"></select></div>
          <label class="check"><input type="checkbox" id="only-notes" /> Solo con notas abiertas</label>
          <div id="about"></div>
        </header>
        <div id="nav"></div>
      </nav>
      <main id="script"><p class="empty">Cargando…</p></main>
    </div>
    <div id="zoom"><img alt="" /></div>
    <div id="toast" role="status"></div>
    <script type="module" src="/src/guion-page.ts"></script>
  </body>
</html>
