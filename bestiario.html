<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bestiario · Gerard 35</title>
    <style>
      :root { --bg: #14170f; --panel: #1b1f16; --line: #ffffff1c; --text: #ece6cf; --soft: #c7c1a6; --dim: #8f8a73; --gold: #f3cf78;
        --own: #7fc88f; --procedural: #8fb4e0; --placeholder: #f0a35a; --part: #b7b08f; --none: #e0707a; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.45 'DM Sans', system-ui, sans-serif; overflow: hidden; }
      button { padding: 4px 9px; border: 1px solid #ffffff2a; border-radius: 3px; background: #ffffff0d; color: inherit; font: inherit; cursor: pointer; }
      button:hover { background: #ffffff1f; } button[aria-pressed="true"] { background: var(--gold); color: #1a1a12; border-color: var(--gold); }
      #app { display: grid; grid-template-columns: 300px 1fr 470px; height: 100%; }
      #side { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
      #side header { padding: 14px 14px 8px; }
      h1 { margin: 0; font-size: 20px; letter-spacing: .02em; white-space: nowrap; } h1 small { color: var(--dim); font-size: 11px; font-weight: 400; margin-left: 6px; }
      #search { width: 100%; margin: 10px 0 8px; padding: 6px 8px; background: #0e100b; color: var(--text); border: 1px solid var(--line); border-radius: 3px; font: inherit; }
      .chips { display: flex; flex-wrap: wrap; gap: 4px; }
      #list { overflow: auto; padding: 0 6px 16px; flex: 1; }
      #list h2 { margin: 14px 8px 4px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #b7b08f; font-weight: 600; }
      #list a { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 3px; color: var(--soft); text-decoration: none; cursor: pointer; }
      #list a:hover { background: #ffffff0d; } #list a[aria-current="true"] { background: #f3cf7826; color: var(--text); }
      #list a small { color: var(--dim); font-size: 11px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, var(--dim)); }
      #stage { position: relative; min-width: 0; display: grid; grid-template-rows: 1fr auto; }
      #canvas { width: 100%; height: 100%; display: block; cursor: grab; min-height: 0; } #canvas:active { cursor: grabbing; }
      #overlay { position: absolute; inset: 0 0 auto 0; padding: 14px 16px; pointer-events: none; display: flex; justify-content: space-between; gap: 10px; }
      #overlay .left { display: flex; flex-direction: column; gap: 8px; max-width: 60%; }
      #overlay .views { pointer-events: auto; display: flex; flex-wrap: wrap; gap: 4px; } #overlay .views:empty { display: none; }
      #overlay .views button { padding: 5px 11px; }
      #model-note { color: var(--soft); text-shadow: 0 1px 2px #000; }
      .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0; } .swatches span { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--soft); }
      .swatches i { width: 14px; height: 14px; border-radius: 3px; background: var(--c); border: 1px solid #ffffff30; }
      .tree { margin: 4px 0 8px; } .tree b { font-size: 12px; }
      #overlay .controls { pointer-events: auto; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; max-width: 60%; }
      #empty { position: absolute; inset: 0 0 160px 0; display: grid; place-items: center; color: var(--dim); text-align: center; padding: 40px; pointer-events: none; }
      #empty img { max-height: 70%; max-width: 70%; border-radius: 4px; }
      #strip { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 10px; overflow-x: auto; min-height: 150px; background: #10130c; }
      #strip figure { margin: 0; flex: none; text-align: center; color: var(--dim); font-size: 11px; }
      #strip img { height: 112px; display: block; border-radius: 3px; background: #ffffff08; cursor: zoom-in; }
      #strip .none { height: 112px; width: 112px; display: grid; place-items: center; border: 1px dashed #ffffff2a; border-radius: 3px; padding: 8px; }
      #detail { border-left: 1px solid var(--line); overflow: auto; padding: 16px 18px 40px; }
      #detail h2 { margin: 0; font-size: 24px; } #detail .sub { color: var(--dim); margin: 2px 0 10px; }
      #detail h3 { margin: 18px 0 6px; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: #b7b08f; font-weight: 600; }
      #detail p { margin: 4px 0; color: var(--soft); }
      .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px; background: #ffffff10; border: 1px solid var(--c); color: var(--text); font-size: 12px; margin: 2px 4px 2px 0; }
      .badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
      table { border-collapse: collapse; width: 100%; font-size: 12px; } td, th { text-align: left; padding: 3px 6px 3px 0; vertical-align: top; border-bottom: 1px solid #ffffff10; }
      th { color: var(--dim); font-weight: 500; }
      .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; } .stats div { background: #ffffff08; border-radius: 3px; padding: 4px 6px; } .stats b { display: block; font-size: 15px; }
      .move { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid #ffffff10; } .move small { color: var(--dim); }
      .skill { padding: 5px 0; border-bottom: 1px solid #ffffff10; } .skill b { color: var(--text); } .skill small { color: var(--dim); margin-left: 6px; }
      .qa { background: #ffffff08; border-left: 3px solid var(--gold); padding: 6px 10px; margin: 6px 0; border-radius: 0 3px 3px 0; }
      .qa p { margin: 2px 0; } .why { font-size: 12px; } .why small { color: var(--dim); }
      ul { margin: 4px 0; padding-left: 18px; color: var(--soft); } li { margin: 2px 0; }
      .steps { display: flex; flex-wrap: wrap; gap: 4px; } .steps span { padding: 2px 7px; border-radius: 3px; font-size: 11px; background: #ffffff08; color: var(--dim); } .steps span.done { background: #7fc88f2b; color: var(--text); }
      #zoom { position: fixed; inset: 0; background: #000000d9; display: none; place-items: center; z-index: 5; cursor: zoom-out; } #zoom img { max-width: 92vw; max-height: 92vh; }
      #status { position: absolute; right: 14px; bottom: 166px; color: var(--dim); font-size: 12px; pointer-events: none; }
      .open-notes { color: var(--placeholder); }
      .mark { color: var(--dim); font-weight: 600; } .mark.redo { color: var(--none); padding: 0 6px; border-radius: 99px; background: #e0707a2e; border: 1px solid var(--none); }
      .notes { margin-top: 6px; padding: 2px 12px 12px; background: #ffffff06; border: 1px solid var(--line); border-radius: 4px; }
      .note { padding: 7px 0; border-bottom: 1px solid #ffffff10; } .note.hecha, .note.descartada { opacity: .55; }
      .note-head { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; } .note-head small { color: var(--dim); margin-left: auto; }
      .note .state { font-size: 11px; color: var(--dim); } .note.abierta .state { color: var(--placeholder); }
      .redo-tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #e0707a2e; border: 1px solid var(--none); }
      .note .reply { border-left: 2px solid var(--own); padding-left: 8px; }
      .note-actions { display: flex; gap: 4px; margin-top: 4px; } .note-actions button { font-size: 11px; padding: 2px 7px; }
      .note-form { margin-top: 8px; } .redo-chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; } .redo-chips span { color: var(--dim); font-size: 12px; }
      .redo-chips button[aria-pressed="true"] { background: var(--none); border-color: var(--none); color: #1a1a12; }
      #note-text { width: 100%; margin: 6px 0 4px; padding: 6px 8px; background: #0e100b; color: var(--text); border: 1px solid var(--line); border-radius: 3px; font: inherit; resize: vertical; }
      .note-save { display: flex; justify-content: flex-end; align-items: center; gap: 8px; } .note-save small { color: var(--dim); }
      .ro, .err { font-size: 12px; } .err { color: var(--none); }
    </style>
  </head>
  <body>
    <div id="app">
      <nav id="side">
        <header>
          <h1>Bestiario <small id="count"></small></h1>
          <input id="search" type="search" placeholder="Buscar por nombre, lugar o movimiento…" />
          <div class="chips" id="filters"></div>
        </header>
        <div id="list"></div>
      </nav>
      <main id="stage">
        <canvas id="canvas"></canvas>
        <div id="overlay"><div class="left"><div class="views" id="views"></div><div id="model-note"></div></div><div class="controls" id="controls"></div></div>
        <div id="empty"></div>
        <div id="strip"></div>
        <div id="status">Cargando…</div>
      </main>
      <aside id="detail"></aside>
    </div>
    <div id="zoom"><img alt="" /></div>
    <script type="module" src="/src/bestiary.ts"></script>
  </body>
</html>
