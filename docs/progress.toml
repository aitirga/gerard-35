# How far the game is: the bar and the priorities at the top of herdr's column, and `just progress`.
# scripts/herdr-progress reads this every few seconds and measures it against the checkout.
#
# A block's `weight` is its part of the whole game; `story` (optional) its part of the story a
# player can walk through. An item's `weight` (default 1) is its part of its block. Adding an item
# makes the bar shrink, finishing or dropping one makes it grow: cut a mission by deleting its items.
#
# An item is done when all of its checks hold, paths relative to the checkout:
#   file = "glob"                 something matches
#   grep = "regex", in = "glob"   the text is in one of those files (`in` can be a list)
#   absent = "regex", in = "glob" the files exist and the text is in none of them
#   done = true                   by hand, for what code cannot tell; it wins over any check
# An item with no check is pending until it gets `done = true`.
# Name what you build as a check expects, or change the check when you build it.

# In the order they should be done. `priority` on an item says which one it counts towards.
[[priority]]
id = "guion"
title = "Fijar el guion"

[[priority]]
id = "alcance"
title = "Decidir qué misiones entran"

[[priority]]
id = "aitor"
title = "La ánima propia de Aitor"

[[priority]]
id = "bernat"
title = "La misión de Bernat"

[[priority]]
