# just game-sim (2026-11-20): «Pensando» and «Con prisa» finish every game (173 and 148 min), the
# latter walled only at El Cebollón; «Sin pensar» finishes 96 % (33 % on 11-19) but in 890 min and 28
# days, walled at El Cebollón, El Campeón, La Sobremesa, Los sillones, Lealtad, El que no converge,
# Aurelià, Dirección and La Delegada. The palace guards on the first try are a wall on purpose.
# After the final pass (2026-11-21, 6 games each): «Pensando» 100 % in 349 min (25 fights lost of
# 110), «Con prisa» 100 % in 204 min, «Sin pensar» 5 of 6 in 1182 min (one cut at too many fights).
[[block.item]]
