# How far the game is: the bar and the priorities at the top of herdr's column, and `just progress`.
# scripts/herdr-progress reads this every few seconds and measures it against the checkout.
#
# A block's `weight` is its part of the whole game; `story` (optional) its part of the story a
# player can walk through. An item's `weight` (default 1) is its part of its block. Adding an item
# makes the bar shrink, finishing or dropping one makes it grow: cut a mission by deleting its items.
#
# An item is done when all of its checks hold, paths relative to the checkout:
#   file = "glob"                 something matches; a module of src/ also needs something to import
#                                 it (another module, or a page of its own): written is not in the game
#   used = "name"                 the name is in two modules of src/ or more: defined in one and used
#                                 in another (a list asks it of each name). The check for anything
#                                 that can exist without being wired in: a gate, a rule, a hook
#   grep = "regex", in = "glob"   the text is in one of those files (`in` can be a list)
#   absent = "regex", in = "glob" the files exist and the text is in none of them
#   done = true                   by hand, for what code cannot tell; it wins over any check
# `note` (optional) says in a line or two what the task is: the panel shows it on a click.
# An item with no check is pending until it gets `done = true`.
# Name what you build as a check expects, or change the check when you build it.
#
# `just progress --audit` says what the bar rests on, which checks can never tick as written, and
# whether the game itself is wired together (scripts/integration.mjs): every flag, place and fight
# in the picker, each fight's pair of targets, each place's song, each ánima's growth, portraits,
# models and what is exported and never used. Run it before calling something done.

# The plan to the end, in the order it is done. The panel lists the pending tasks in this order
# (a task's `priority` says its phase; one without comes last), and a click on one shows its note.
[[priority]]
id = "animas"
title = "Ánimas completas"

[[priority]]
id = "crecimiento"
title = "Crecimiento por el castillo"

[[priority]]
id = "historia"
title = "Misiones, castillo y final"

[[priority]]
id = "pruebas"
title = "Pruebas y optimización"

