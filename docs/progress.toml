weight = 2

# AGENTS.md § Game philosophy: each fight keeps a pair of TARGETS (src/battle-sim.ts), one playing its
# answer and one without it. `just progress --audit` § Combates lists the fights with none or only
# one (22 on 2026-11-20: chapter 1's dogs, the palace guards, most of the castle's rooms), and
# `just fight-sim check` the targets a fight misses (25 of 112 on 2026-11-20, after the crits).
[[block.item]]
title = "Cada combate con su pareja de objetivos en el simulador"
priority = "pruebas"
note = "Los dos TARGETS de cada combate, jugando su respuesta y sin ella: hechos en la pasada final (21-11), just fight-sim coverage no lista ninguno. Los que solo enseñan (los primeros perros, la primera sala de cada curso del castillo y los combates de entrada de cada misión) llevan un objetivo que los sujeta fáciles. Se marca a mano."
done = true

# Decided 2026-11-21 with just fight-sim progress and just game-sim: each friend's ánima adds to the
# party's attributes, so an open mission's foes grow with the other missions' ánimas (FOE_GROWTH), and
# levels 4 to 7 cost what the castle's fights, worth three times their foes, can pay (docs/fight-sim.md § Progression).
[[block.item]]
title = "El crecimiento del equipo acompaña a la historia: cada ánima sube al equipo, los enemigos de las misiones abiertas crecen con ellas, los niveles 5 a 7 se alcanzan y el castillo pide ánimas"
priority = "pruebas"
used = ["FOE_GROWTH", "FIGHT_GROWTH", "gatheredFor", "XP_RULES", "ANIMA_GROWTH"]
note = "Cada ánima da un 12 % más de todo (ANIMA_GROWTH); por cada ánima de otra misión abierta, los enemigos de cada combate crecen según su propia regla (FIGHT_GROWTH: atributos, Fuerza y Magia de más desde el 22-11 y algo de PV, lo que deja cada misión un reto hecha en cualquier orden: just fight-sim curve); el castillo y la noche no crecen ni se ablandan con el equipo (FOE_BLOW.castle, NIGHT_PUPILS), miden lo hecho; LEVEL_XP de 4 a 7 en 950, 1.150, 1.400 y 1.700, los combates del castillo valen el triple de EXP y los de noche vez y media (XP_RULES); Aurelià pide las ánimas de Nuria y dos misiones, y Dirección las de casi todas (objetivos aurelia-con-una, aurelia-con-dos, direccion-con-dos). Medido en docs/fight-sim.md § Progression y § Power and the castle."

