<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101f25" />
    <meta name="description" content="Una reconstrucción jugable de Passatge Maresme en Sant Quirze del Vallès." />
    <title>Passatge Maresme · Gerard 35</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101f25'/%3E%3Cpath d='M32 12 52 32 32 52 12 32Z' fill='none' stroke='%23e9ad48' stroke-width='5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Barrio isométrico. W, A, S y D para moverte. E para interactuar con las puertas. C para personaje. M para mapa."></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <main id="hud">
      <section class="place-panel" aria-label="Entorno">
        <span class="eyebrow">SANT QUIRZE DEL VALLÈS</span>
        <select id="environment" aria-label="Elegir entorno">
          <option value="maresme">Passatge Maresme</option>
          <option value="patio">El patio · Prueba de movimiento</option>
          <option value="home-entrance" disabled>Casa de Gerard · Entrada</option>
          <option value="home-floor-1" disabled>Casa de Gerard · Planta 1</option>
          <option value="home-floor-2" disabled>Casa de Gerard · Planta 2</option>
        </select>
        <span id="location-detail">Reconstrucción aproximada · Nº 20</span>
        <button id="overview">Vista general <kbd>R</kbd></button>
      </section>
      <button id="interact" hidden><kbd>E</kbd><span></span><small></small></button>
      <footer class="bottom-bar">
        <div class="controls"><div class="move-keys" aria-hidden="true"><kbd>W</kbd><div><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div></div><div><strong>Mover</strong><span>WASD · Joystick &nbsp; / &nbsp; E para interactuar</span></div></div>
      </footer>
      <nav class="touch-controls" aria-label="Controles de movimiento">
        <button data-direction="up" aria-label="Mover arriba">↑</button>
        <button data-direction="left" aria-label="Mover izquierda">←</button>
        <button data-direction="down" aria-label="Mover abajo">↓</button>
        <button data-direction="right" aria-label="Mover derecha">→</button>
      </nav>
    </main>
    <section id="error" hidden role="alert"><h2>No se ha podido abrir el entorno</h2><p>Comprueba que tu navegador tiene la aceleración gráfica activada.</p><button onclick="location.reload()">Reintentar</button></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
