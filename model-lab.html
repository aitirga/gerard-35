<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratorio de modelos · Gerard 35</title>
    <style>
      html, body { margin: 0; height: 100%; background: #171b14; color: #ece6cf; font: 13px/1.4 'DM Sans', system-ui, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
      #stage:active { cursor: grabbing; }
      #panel { position: fixed; top: 16px; left: 16px; width: 260px; max-height: calc(100% - 32px); overflow: auto; padding: 14px 16px; background: #10140fd9; border: 1px solid #ffffff1c; border-radius: 4px; }
      h1 { margin: 0 0 2px; font-size: 18px; } h2 { margin: 14px 0 6px; font-size: 10px; letter-spacing: .18em; color: #b7b08f; font-weight: 600; }
      p { margin: 4px 0; color: #c7c1a6; }
      .row { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center; margin: 3px 0; }
      .row i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--c); }
      button { padding: 4px 8px; border: 1px solid #ffffff2a; border-radius: 3px; background: #ffffff0d; color: inherit; font: inherit; cursor: pointer; }
      button:hover { background: #ffffff1f; } button[aria-pressed="true"] { background: #f3cf78; color: #1a1a12; border-color: #f3cf78; }
      .wide { display: flex; flex-wrap: wrap; gap: 4px; }
      #status { position: fixed; right: 16px; bottom: 14px; color: #b7b08f; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <aside id="panel"></aside>
    <div id="status">Cargando…</div>
    <script type="module" src="/src/model-lab.ts"></script>
  </body>
</html>
