about = """One of La Reina Bubbaloo's pupils: chewed bubble gum moulded into the shape of a school pupil. Not a real child and not a person: a thing of gum that has copied one. The school smock is only hinted by a few big folds and a hem in the gum itself. Where the face should be there is no face, only a bubble of gum: no eyes, no mouth, no nose. Its feet melt into the floor in thick strings of gum.
SECOND YEAR, older gum: grown taller and lanky, the gum gone a deep bruised plum-maroon and set harder, split by a few big cracks through which its filling glows a cold water blue. A manila paper file tag hangs from its wrist on a string, and a round registry stamp in dark navy ink is pressed into its chest.
THIS ONE, the absent: not there. An empty shell of a pupil, a hollow skin of gum with nothing inside, washed out and paler than the others. Its front is split open from the neck to the hem, showing a dark empty hollow inside. Its sleeves are limp and empty. Its face bubble has gone soft and hangs forward over the chest like a veil. It stands on two thin, stretched strings of gum."""
height = 1.7
[ausente.view_notes]
back = "Its back is whole and smooth: the split is only in front."

