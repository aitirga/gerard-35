SECOND YEAR, older gum: grown huge and lanky, the gum gone a deep bruised plum-maroon and set harder, split by a few big cracks through which its filling glows a deep fire orange. A manila paper file tag hangs from its wrist on a string, and a round registry stamp in dark navy ink is pressed into its chest.
THIS ONE, the one punished, made to stand facing the wall: taller than a grown man, bent forward, its head bowed so low that the small face bubble is pressed against its own chest. Out of its back, between the shoulders, swells an enormous bubble of stretched gum, a hunch bigger than its whole torso that rises high above its shoulders and bowed head, so that from the front it is a great taut dome behind and above it. The bubble is thin and tight, about to burst, the orange filling glowing through its skin. Long arms hanging to its knees, hands open, fingers spread, trembling."""
height = 2.2
[castigado.view_notes]
back = "The enormous swollen bubble fills its whole back, thin and tight, the orange filling glowing through it."
left = "In profile the bubble on its back is as big as the rest of it, the head bowed in front."
right = "In profile the bubble on its back is as big as the rest of it, the head bowed in front."

[monton]
name = "El Montón"
kind = "creature"
about = """One of La Reina Bubbaloo's pupils: chewed bubble gum that should have been moulded into the shape of a school pupil, and never was. Not a real child and not a person: everything in it is gum.
THIRD YEAR, the Queen's own gum gone bad (Aitor, 2026-11-19: more gum, more contrast): loud, saturated hot bubble-gum pink, more gum than ever, stretchy, with the soft sheen of freshly chewed gum, bubbles swelling and half-burst all over it and long stretched strings; and at the same time rotting: big patches of black spreading through the pink like necrosis, clusters of big black pustules and blisters, each the size of a fist, black veins in the stretched parts, hard black crust at the edges of the burst bubbles. Strong contrast: hot pink against black, nothing grey.
THIS ONE, the new one, gum with no shape yet: a slumped heap of gum as tall as a door, heavy, wider than tall, with no legs. Out of it push shapes of pupils that never finished forming, all of the same gum: two or three long arms of different sizes with fused, half-made fingers, the fold of a smock's collar, and several face bubbles half sunk in the mass, each with the hollow imprint of a face, some taut and swollen, some burst and black at the edges. No blocky shapes, no clothes, no colours but the gum's pink and black."""
height = 2.6

