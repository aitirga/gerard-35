# Who `just character-3d` can make (tools/character_3d.py, tools/README.md). One table per figure; its
# name is the id of its files in the game.
#
# kind = "person"    Walks and talks with the game's rig: Gerard, a friend, an NPC.
#   photos           Under assets/references/characters/: the ones that MAY be sent to OpenAI, clothed,
#                    of adults. None: it is drawn from `about` alone.
#   art              Images of the game's own that show who it is, from the project's root: another figure's
#                    toy, say. A real child's look comes from words, art and adult photos, never a child's photo.
#   face_photos      Of those, the best of the face. Without `photos` they go straight to the toy, with no
#                    full-body front: for an adult drawn younger, or when one photo of the face is all there is.
#   about            Who they are and what they wear.
#   cues             What makes them themselves, as big shapes and colours. Only with photos.
#   height           Metres in the game: the cast is close in size.
#   scale            The entity's scale in the game (1 for an NPC; `scale` of a sleeper in src/bed.ts).
#   clean_shaven     Paints a moustache the model came with off its texture, without paying for another.
#   backpack         A school backpack the game builds on its back: { bag = "#hex", straps = "#hex" }. It is
#                    not in the images: Meshy only makes the body, and Gerard's shows once he picks it up.
# kind = "creature"  A foe or a monster, in one piece: Meshy only gives a skeleton to human shapes.
#   about            What it is and what it looks like.
#   height           Metres in the game.
# view_notes         Optional, by view (left, right, back): something only that side shows.

[gerard-adult]
name = "Gerard"
kind = "person"
photos = ["gerard/gerard-adulto-01.jpg", "gerard/gerard-adulto-02.jpg", "gerard/gerard-adulto-03.jpg", "gerard/gerard-adulto-05.jpg", "gerard/gerard-adulto-06.jpg"]
face_photos = ["gerard/gerard-adulto-01.jpg", "gerard/gerard-adulto-05.jpg"]
about = "About him: 35, slim and athletic. A long, narrow face. Round thin dark glasses with a keyhole bridge. Dark brown short hair, short on the sides, longer on top and swept to one side with high temples. Brown eyes. Long nose. Clean shaven, no moustache and no beard.\nClothes: an olive green hoodie with its hood down and white drawstrings with metal eyelets, dark jeans, white trainers, no logos."
cues = "a clearly long, narrow head, a long nose, round thin dark glasses as his strongest feature, dark brown hair swept to one side in big chunks, clean shaven with no moustache"
height = 1.75
scale = 1.27
clean_shaven = true
[gerard-adult.view_notes]
back = "The hood hangs down his back, the glasses temples just visible."

[aitor]
name = "Aitor"
