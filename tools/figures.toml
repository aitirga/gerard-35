# The castle's pupils (docs/castle.md § Bestiary), La Reina Bubbaloo's: one family, three years. Each is
# drawn in the year it first comes out; El Repetidor in all three, to see the gum age. Every `about` opens
# with the family and its year, then says what only this one has, which is how it fights.
[chivata]
name = "La Chivata"
kind = "monster"
about = """One of La Reina Bubbaloo's pupils: chewed bubble gum moulded into the shape of a school pupil. Not a real child and not a person: a thing of gum that has copied one. The school smock is only hinted by a few big folds and a hem in the gum itself. Where the face should be there is no face, only a taut smooth bubble of gum with the faint hollow imprint of a face pressed into it from inside: no eyes, no mouth, no nose. Its feet melt into the floor in thick strings of gum.
FIRST YEAR, fresh gum: soft, freshly chewed, the pale greyish flesh pink of real chewed gum. The face bubble is the only bright saturated gum pink on it. Its hands are chalk white, as if dipped in a gymnast's chalk, the white smeared up the forearms.
THIS ONE, the informer: the smallest and thinnest of them, standing on tiptoe and leaning forward, eager. Her left arm is normal. Her right arm is stretched to twice her height, thin as a rope of pulled gum, hanging down to the floor and ending in one long white pointing finger. Her small face bubble is tilted to one side, as if listening behind a door."""
height = 1.0
[chivata.view_notes]
right = "Her long, rope-thin arm hangs on this side, down to the floor."
left = "This arm is short and normal; the long one shows behind her."

[empollon]
name = "El Empollón"
kind = "monster"
about = """One of La Reina Bubbaloo's pupils: chewed bubble gum moulded into the shape of a school pupil. Not a real child and not a person: a thing of gum that has copied one. The school smock is only hinted by a few big folds and a hem in the gum itself. Where the face should be there is no face, only a taut smooth bubble of gum with the hollow imprint of a face pressed into it from inside, like a face pushed against a rubber sheet: brow, nose and closed lips just showing, no eyes. Its feet melt into the floor in thick strings of gum.
FIRST YEAR, fresh gum: soft, freshly chewed, the pale greyish flesh pink of real chewed gum. The face bubble is the only bright saturated gum pink on it. Its hands are chalk white, as if dipped in a gymnast's chalk, the white smeared up the forearms.
THIS ONE, the swot: a thin, bent little body under a face bubble far too big for it, swollen like a balloon about to burst, so heavy it hangs forward and down on a neck stretched thin as a rope. The bubble's skin is so thin that a dark folded mass shows through it, like a brain in a jar. Long thin arms. Hard grey patches of dried crust, like scabs, on its arms and shoulders: every blow it has learned to take. Nothing round or soft about the body: bony, too thin, too still."""
height = 1.15

[gemelo]
name = "Los Gemelos"
