about = """One of La Reina Bubbaloo's pupils: chewed bubble gum moulded into the shape of a school pupil. Not a real child and not a person: a thing of gum that has copied one. The school smock is only hinted by a few big folds and a hem in the gum itself. Where the face should be there is no face, only a taut smooth bubble of gum with the faint hollow imprint of a face pressed into it from inside: no eyes, no mouth, no nose. Its feet melt into the floor in thick strings of gum.
FIRST YEAR, fresh gum: soft, freshly chewed, the pale greyish flesh pink of real chewed gum. The face bubble is the only bright saturated gum pink on it. Its hands are chalk white, as if dipped in a gymnast's chalk, the white smeared up the forearms.
THIS ONE, the class delegate, in charge of the others and the history teacher's favourite: taller than the rest, thin, rigid and very upright, chin high. A wide band of hardened darker gum across her chest like a sash. Around her face bubble, a wreath of laurel leaves made of dark, hardened gum, like a Roman emperor's. From each of her long fingers a long thread of gum hangs to the floor, like a puppeteer's strings."""
height = 1.6
