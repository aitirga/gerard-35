FIRST YEAR, fresh gum: soft, freshly chewed, the pale greyish flesh pink of real chewed gum. The face bubble is the only bright saturated gum pink on it. Its hands are chalk white, as if dipped in a gymnast's chalk, the white smeared up the forearms.
THIS ONE, one of a pair of twins (the game shows it twice, mirrored): too tall and too thin for its age, with a neck a little too long, standing perfectly straight and perfectly symmetrical, arms hanging dead straight, as still as a mannequin. No hood and no hair: just the face bubble on the long neck, and the bubble is lopsided, flattened flat on its right side as if pressed for years against its twin's. From its right hand a thick band of stretched gum hangs down to the floor and trails away, torn at the end: it was joined to the other."""
